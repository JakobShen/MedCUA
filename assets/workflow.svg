<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 442" fill="none">
  <title>From workflow to evidence</title>
  <desc>Illustrative pulmonary embolism workflow. Review a CTPA study and clinical records together, then record a risk class with its source slice, measurement and clinical note.</desc>
  <defs>
    <pattern id="dot-grid" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7ba38b" opacity=".16"/>
    </pattern>
  </defs>
  <rect width="568" height="442" rx="20" fill="#123d32"/>
  <rect x="1" y="1" width="566" height="440" rx="19" fill="url(#dot-grid)"/>
  <path d="M28 60h512" stroke="#527568"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="28" y="39" fill="#f6f8ed" font-size="16" font-weight="650">From workflow to evidence</text>
    <text x="540" y="38" text-anchor="end" fill="#bed2c4" font-size="12">Illustrative example</text>
    <rect x="28" y="82" width="247" height="98" rx="10" fill="#204b3f" stroke="#557e6d"/>
    <rect x="293" y="82" width="247" height="98" rx="10" fill="#204b3f" stroke="#557e6d"/>
    <rect x="44" y="99" width="60" height="64" rx="6" fill="#153a31" stroke="#507665"/>
    <g stroke="#b1cdb5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="74" cy="131" rx="22" ry="19"/>
      <path d="M69 118c-8 3-13 11-11 20 4 6 11 4 13-2 2-5 2-13-2-18Zm10 0c8 3 13 11 11 20-4 6-11 4-13-2-2-5-2-13 2-18Z" fill="#799e84" fill-opacity=".23"/>
      <path d="M65 135h18m-14-5 10 10" stroke="#d7e9b0"/>
    </g>
    <text x="120" y="124" fill="#f4f8ef" font-size="17" font-weight="650">CTPA study</text>
    <text x="120" y="148" fill="#bed2c4" font-size="13">Images and findings</text>
    <rect x="309" y="99" width="60" height="64" rx="6" fill="#153a31" stroke="#507665"/>
    <g stroke="#c1d7be" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M327 114h18l7 7v26h-25zM345 114v7h7M333 128h12m-12 5h12m-12 5h8"/>
    </g>
    <text x="385" y="124" fill="#f4f8ef" font-size="17" font-weight="650">Clinical record</text>
    <text x="385" y="148" fill="#bed2c4" font-size="13">Vitals and lab results</text>
    <path d="M152 180v17a10 10 0 0 0 10 10h122m132-27v17a10 10 0 0 1-10 10H284v16" stroke="#91b69d" stroke-width="1.5"/>
    <path d="m280 218 4 5 4-5" stroke="#91b69d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="284" cy="207" r="3" fill="#cfe8b6"/>
    <rect x="98" y="223" width="372" height="62" rx="10" fill="#2a594b" stroke="#628a78"/>
    <path d="M120 244h19m-19 8h19m-19 8h19m-13-19v6m8 2v6m-9 2v6" stroke="#d7e9c8" stroke-width="1.4" stroke-linecap="round"/>
    <text x="155" y="250" fill="#f7f9f1" font-size="16" font-weight="650">Review both sources</text>
    <text x="155" y="271" fill="#d0e0d6" font-size="13">Measure, compare, and document</text>
    <path d="M284 285v32m-4-5 4 5 4-5" stroke="#a6c8ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="318" width="512" height="96" rx="10" fill="#edf3e4"/>
    <text x="48" y="351" fill="#18382e" font-size="18" font-weight="690">Risk class and supporting evidence</text>
    <circle cx="508" cy="347" r="13" fill="#d8e8cd"/>
    <path d="m502 347 4 4 7-8" stroke="#286749" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="368" width="101" height="27" rx="5" fill="#f9fbf6" stroke="#c5d5bd"/>
    <rect x="157" y="368" width="111" height="27" rx="5" fill="#f9fbf6" stroke="#c5d5bd"/>
    <rect x="276" y="368" width="104" height="27" rx="5" fill="#f9fbf6" stroke="#c5d5bd"/>
    <g fill="#456054" font-size="12">
      <text x="59" y="386">Source slice</text>
      <text x="168" y="386">Measurement</text>
      <text x="287" y="386">Clinical note</text>
    </g>
  </g>
</svg>
